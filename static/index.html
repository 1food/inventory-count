<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f4">
  <title>재물조사 · {{ORG_NAME}}</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("inventory-theme");
        const theme = saved === "dark" || saved === "light"
          ? saved
          : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      } catch (_) {
        document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
    })();
  </script>
  <link rel="icon" href="/brand/logo">
  <link rel="apple-touch-icon" href="/brand/logo">
  <link rel="preload" href="/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/app.css">
  <script src="/vendor/tesseract/tesseract.min.js" defer></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body data-org="{{ORG_NAME}}" data-demo="{{DEMO}}">
  {{DEMO_BANNER}}
  <header class="topbar">
    <div class="topbar-inner">
      <button class="icon-button" id="backButton" aria-label="뒤로" hidden></button>
      <span class="brand-mark" id="brandMark" aria-label="{{ORG_NAME}}" hidden></span>
      <h1 class="topbar-title" id="pageTitle">재물조사</h1>
      <div class="topbar-actions">
        <button class="home-button" id="homeButton" aria-label="처음 화면으로" hidden></button>
        <button class="icon-button theme-toggle" id="themeToggle" type="button" hidden></button>
      </div>
    </div>
  </header>
  <main id="app" class="app-shell" aria-live="polite" aria-busy="false"></main>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="loading" id="loading" role="status" aria-live="polite" hidden><div class="spinner"></div><b id="loadingText">불러오는 중</b></div>
</body>
</html>
